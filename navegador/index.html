<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilha</title>
  <style>
    :root { color-scheme: light dark; --faixa: #2f6f4e; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: Canvas; }
    #faixa { background: var(--faixa); color: #fff; font-size: .8rem; padding: .35rem 1rem; line-height: 1.4; }
    #faixa a { color: #fff; }
    #pagina { flex: 1; border: 0; width: 100%; }
    #carregando { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: .75rem; padding: 1rem; text-align: center; }
    #carregando progress { width: min(20rem, 80vw); accent-color: var(--faixa); }
    #carregando .erro { color: #b00020; font-weight: 600; max-width: 36rem; }
  </style>
</head>
<body>
  <div id="faixa">
    Esta versão roda o Django inteiro no seu navegador (Pyodide). Os dados ficam salvos só neste
    navegador. <a href="https://github.com/vitormoreiradesenvolvedor/gcc265-trilha-django">Código-fonte</a>
  </div>
  <div id="carregando">
    <strong>Carregando o Trilha…</strong>
    <progress></progress>
    <span id="etapa">Baixando o Python para o navegador</span>
  </div>
  <iframe id="pagina" title="Trilha" hidden></iframe>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
  <script src="app.js"></script>
</body>
</html>
