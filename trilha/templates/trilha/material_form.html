{% extends "trilha/base.html" %}

{% block titulo %}{% if object %}Atualizar material{% else %}Novo material{% endif %}{% endblock %}

{% block conteudo %}
  <h1>{% if object %}Atualizar “{{ object.titulo }}”{% else %}Novo material{% endif %}</h1>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
    <a href="{% url 'trilha:minha_trilha' %}">Cancelar</a>
  </form>
{% endblock %}
