{% extends "trilha/base.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
  <h1>Criar conta</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{% url 'trilha:entrar' %}">Entrar</a>.</p>
{% endblock %}
